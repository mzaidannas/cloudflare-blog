---

services:
  minio:
    image: minio/minio
    ports:
      - "9002:9002"
      - "9001:9001"
    volumes:
      - minio:/data
      - ./docker/minio/entrypoint.sh:/docker/minio/entrypoint.sh:ro
    entrypoint: /docker/minio/entrypoint.sh
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: e026084d93db6e87
    command: server --address ":9002" --console-address ":9001" /data

  quickwit:
    image: quickwit/quickwit:v0.9.0-rc
    ports:
     - "7280:7280"
    volumes:
     - ./quickwit-index-config.yaml:/quickwit/index-config.yaml:ro
     - ./docker/quickwit/entrypoint.sh:/docker/quickwit/entrypoint.sh:ro
    entrypoint: /docker/quickwit/entrypoint.sh
    environment:
      QW_S3_ENDPOINT: http://minio:9002
      QW_S3_FORCE_PATH_STYLE_ACCESS: true
      AWS_REGION: us-east-1
      S3_PATH: s3://quickwit/indexes
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: e026084d93db6e87
    depends_on:
      - minio

  clickhouse:
    image: clickhouse/clickhouse-server:26.1.12-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    environment:
      # Default user and database will be created using `init-defaults.sh` script
      CLICKHOUSE_DB: r0
      CLICKHOUSE_USER: demouser
      CLICKHOUSE_PASSWORD: 239QV8JkGmF9AZM
      S3_PATH: http://minio:9002/clickhouse/
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: e026084d93db6e87
      #    ulimits:
      #nproc: 65535
      #nofile:
      #  soft: 262144
      #  hard: 262144
    volumes:
      - ./docker/clickhouse/init-defaults.sh:/docker-entrypoint-initdb.d/init-defaults.sh:ro
      - ./docker/clickhouse/s3_storage_policy.xml:/etc/clickhouse-server/config.d/s3_storage_policy.xml:ro
    depends_on:
      - minio

  vector:
    image: timberio/vector:0.55.0-distroless-static
    ports:
      - 8888:8888
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
    command: ["--config", "/etc/vector/vector.toml"]
    depends_on:
      - clickhouse
      - quickwit

  grafana:
    image: grafana/grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_PLUGINS_PREINSTALL=grafana-clickhouse-datasource,quickwit-quickwit-datasource@@https://github.com/quickwit-oss/quickwit-datasource/releases/download/v0.6.0/quickwit-quickwit-datasource-0.6.0.zip
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    entrypoint: /docker/grafana/entrypoint.sh
    volumes:
      - ./dashboards/demo-logs.json:/var/lib/grafana/dashboards/demo-logs.json:rw
      - ./docker/grafana/entrypoint.sh:/docker/grafana/entrypoint.sh:ro
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse
      - quickwit

volumes:
  minio: {}
